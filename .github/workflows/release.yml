name: Release

# A release is published for every new version:
#   - automatically, when a push to main carries a version in meson.build
#     that has no release yet (GitHub creates the v<version> tag), or
#   - when you push a matching tag yourself:
#       git tag -a v0.2.0 -m "SMail 0.2.0" && git push origin v0.2.0
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Is there a new version?
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n "s/^ *version: *'\([^']*\)'.*/\1/p" meson.build | head -n1)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $VERSION in meson.build"
              exit 1
            fi
          fi
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists, nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $VERSION has no release yet, publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build & publish release
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential meson pkg-config dpkg-dev jq \
            libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev libgmime-3.0-dev \
            libsecret-1-dev libcurl4-openssl-dev libsqlite3-dev libjson-glib-dev \
            glib-networking dovecot-imapd

      - name: Build and test
        run: |
          meson setup build -Dwerror=true
          meson compile -C build
          meson test -C build --print-errorlogs
          tests/live-servers.sh > live.env
          . ./live.env
          test -n "$SMAIL_TEST_IMAP" && test -n "$SMAIL_TEST_SMTP"
          ./build/test-imap --tap | tee test-imap.log
          ! grep -q "# SKIP" test-imap.log

      - name: Source tarball
        run: |
          meson dist -C build --formats xztar --no-tests
          mkdir -p dist
          cp build/meson-dist/*.tar.xz dist/

      - name: Ubuntu 24.04 package
        run: packaging/build-deb.sh dist

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release notes
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          # the CHANGELOG section for this version, up to the next "## " heading
          awk -v v="$VERSION" '
            $0 ~ "^## \\[?" v "\\]?" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'NOTES'

          ### Install

          **Ubuntu 24.04 or newer:** download the `.deb` below, then run

          ```bash
          sudo apt install ./smail_*.deb
          ```

          **Other distributions:** build from the source tarball, following the README.
          NOTES
          sed -i 's/^          //' notes.md
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "SMail $VERSION" \
            --notes-file notes.md
